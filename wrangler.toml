# KiraEnterprise v5.5 - Wrangler Configuration
# Cloudflare Workers configuration
#
# D1 Database:
#   Name: name
#   ID: 134deb69-2609-4b84-8e5c-079aa8d9ba3a
#
# Production Worker URL: https://kiraenterprisev5-5.mykira.workers.dev

name = "kiraenterprisev5-5"
compatibility_date = "2024-01-01"
main = "workers/index.ts"

# Serve frontend static assets
[assets]
directory = "./dist"
binding = "ASSETS"

# ============================================
# Default Environment (Production)
# ============================================

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "name"
database_id = "134deb69-2609-4b84-8e5c-079aa8d9ba3a"

# R2 Bucket Binding (uncomment after creating the bucket)
# Run: wrangler r2 bucket create kiraenterprise-documents
# [[r2_buckets]]
# binding = "DOCUMENTS"
# bucket_name = "kiraenterprise-documents"

# ============================================
# Environment Variables
# ============================================
[vars]
# JWT secret for signing/verifying tokens (HMAC-SHA256)
# CHANGE THIS in production - min 32 chars
JWT_SECRET = "kira-enterprise-dev-secret-change-in-prod"
# Auth disabled mode: true = demo mode (no password check, use first active user)
# Set to "false" for production with real password verification
AUTH_DISABLED = "true"
