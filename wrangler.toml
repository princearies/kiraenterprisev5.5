# KiraEnterprise v5.5 - Wrangler Configuration
# Cloudflare Workers + Pages configuration
#
# D1 Database:
#   Name: kiraenterprise-db
#   ID: 134deb69-2609-4b84-8e5c-079aa8d9ba3a
#
# Production Worker URL: https://kiraenterprisev5-5.mykira.workers.dev

name = "kiraenterprise"
compatibility_date = "2024-01-01"
main = "workers/index.ts"

# Pages configuration
pages_build_output_dir = "dist"

# ============================================
# Default (Local Development)
# ============================================

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "kiraenterprise-db"
database_id = "134deb69-2609-4b84-8e5c-079aa8d9ba3a"

# R2 Bucket Binding
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "kiraenterprise-documents"

# ============================================
# Staging Environment
# ============================================
[env.staging]
name = "kiraenterprise-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "kiraenterprise-db-staging"
database_id = "PLACEHOLDER-STAGING-D1-ID"

[[env.staging.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "kiraenterprise-documents-staging"

# ============================================
# Production Environment
# ============================================
[env.production]
name = "kiraenterprisev5-5"
routes = [
  { pattern = "kiraenterprisev5-5.mykira.workers.dev", zone_name = "mykira.workers.dev" }
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "kiraenterprise-db"
database_id = "134deb69-2609-4b84-8e5c-079aa8d9ba3a"

[[env.production.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "kiraenterprise-documents"
